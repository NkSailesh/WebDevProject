<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="OrGame">
         <p class="title">Rock Paper Scissor</p>
   
     <button class="Move-Button" onclick="
       PlayTheGame('rock');
        "><img src="Image/rock.jpg" alt="Rock" class="Move-Icon"></button>

     <button class="Move-Button" onclick="
       PlayTheGame('paper');
        "><img src="Image/paper.jpg" alt="Paper" class="Move-Icon"></button>

      
     <button  class="Move-Button" onclick="
       PlayTheGame('scissor');
        "><img src="Image/scissor.jpg" alt="Scissor" class="Move-Icon"></button>

        <p class="js-times"></p>
        <p class="js-chois"> </p>
        <p class="js-move"></p>
        <button class="button-css" onclick="
        Times.lose=0;
        Times.win=0;
        Times.tai=0;
          updateResult();
        
       
        ">Reset</button>
        <button 
        onclick=" autoPlay();"
        class="Autoplay">Autoplay</button>
       
    </div>
   
        
     <script src="script.js"></script>
</body>
</html>
